services:
  polaris:
    image: apache/polaris:1.8.0-jdbc
    container_name: polaris_docker
    restart: unless-stopped
    ports:
      - "8181:8181"
      - "8182:8182"
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "5"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "100"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "5000"

      QUARKUS_DATASOURCE_JDBC_URL: ${QUARKUS_DATASOURCE_JDBC_URL}
      QUARKUS_DATASOURCE_USERNAME: ${QUARKUS_DATASOURCE_USERNAME}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD}

      POLARIS_REALM_CONTEXT_REALMS: ${POLARIS_ROOT_REALM}
      POLARIS_BOOTSTRAP_CREDENTIALS: ${POLARIS_ROOT_REALM},${POLARIS_ROOT_CLIENT_ID},${POLARIS_ROOT_CLIENT_SECRET}

      QUARKUS_OTEL_SDK_DISABLED: "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "false"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["S3"]'

      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_ACCESS_KEY}
      AWS_REGION: us-east-1

    networks:
      - dockerlab_network

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

networks:
  dockerlab_network:
    external: true