name: trino_docker

services:
  trino_docker:
    image: trinodb/trino:477

    container_name: trino_docker

    ports:
      - "${TRINO_PORT}:8080"

    volumes:
      - ./etc:/etc/trino
      - ./catalog:/etc/trino/catalog

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

    networks:
      - default

networks:
  default:
    external: true
    name: dockerlab_network