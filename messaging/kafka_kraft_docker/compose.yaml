name: kafka_kraft_docker

services:
  kafka_kraft_docker:
    image: apache/kafka:4.1.2
    container_name: kafka_kraft_docker

    env_file:
      - .env

    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LOG_DIRS: /var/lib/kafka/data

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka_kraft_docker:29092,EXTERNAL://localhost:${KAFKA_BROKER_PORT}

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka_kraft_docker:9093
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      TZ: ${TZ}

    ports:
      - "${KAFKA_BROKER_PORT}:9092"

    volumes:
      - kafka_kraft_docker_data:/var/lib/kafka/data

    restart: unless-stopped

volumes:
  kafka_kraft_docker_data:
    name: kafka_kraft_docker_data

networks:
  default:
    external: true
    name: dockerlab_network    